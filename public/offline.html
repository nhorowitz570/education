<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  /><meta name="theme-color" content="#FBF8F4" /><title>
    Fieldwork · Offline</title
  ><style>
    body {
      font: 16px/1.6 system-ui;
      background: #fbf8f4;
      color: #202023;
      max-width: 620px;
      margin: 10vh auto;
      padding: 24px;
    }
    h1 {
      font-size: 44px;
      line-height: 1.1;
      letter-spacing: -0.05em;
      font-weight: 500;
    }
    button,
    a {
      font: inherit;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      border: 0;
      border-radius: 30px;
      padding: 10px 24px;
      background: #202023;
      color: white;
      text-decoration: none;
      cursor: pointer;
    }
    article {
      background: #c5ebdd;
      padding: 24px;
      border-radius: 24px;
      margin: 24px 0;
    }
    label {
      display: block;
      margin: 20px 0;
    }
    select {
      font: inherit;
      padding: 12px;
      border-radius: 12px;
    }
    button:focus-visible,
    a:focus-visible,
    select:focus-visible {
      outline: 3px solid #4d6d61;
      outline-offset: 4px;
    }
    p {
      white-space: pre-wrap;
    }
    #status {
      color: #5f5a56;
    }
  </style>
  <body>
    <p>FIELDWORK</p>
    <h1>A little room<br />to keep going.</h1>
    <p>
      You’re offline. Read a lesson you saved or leave a quick check-in. New
      lessons, voice, and calendar sync need a connection.
    </p>
    <div id="lessons"></div>
    <form id="checkin" hidden>
      <label
        >Energy
        <select name="energy">
          <option value="1">Low</option>
          <option value="3" selected>Okay</option>
          <option value="5">Plenty</option>
        </select></label
      ><label
        >Time
        <select name="minutes">
          <option value="20">20 minutes</option>
          <option value="60">One hour</option>
        </select></label
      ><button>Save a check-in</button>
    </form>
    <p id="status" role="status"></p>
    <a href="/">Try reconnecting</a>
    <script src="/offline.js" defer></script>
  </body>
</html>
