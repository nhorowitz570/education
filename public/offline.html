<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  /><meta name="theme-color" content="#09090a" /><title>
    Fieldwork · Offline</title
  ><style>
    :root {
      color-scheme: dark light;
      --bg: #09090a;
      --surface: #141416;
      --text: #f2f1ed;
      --text-2: #a3a29d;
      --line: #232326;
      --accent: #f2f1ed;
      --on-accent: #09090a;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f4f0;
        --surface: #ebe9e3;
        --text: #16171a;
        --text-2: #5f5e59;
        --line: #dedcd5;
        --accent: #16171a;
        --on-accent: #f5f4f0;
      }
    }
    body {
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Instrument Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 560px;
      margin: 12vh auto;
      padding: 24px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--text-2);
    }
    h1 {
      font-size: 40px;
      line-height: 1.08;
      letter-spacing: -0.035em;
      font-weight: 500;
      margin: 8px 0 16px;
    }
    button,
    a {
      font: inherit;
      font-weight: 500;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      border: 0;
      border-radius: 14px;
      padding: 10px 22px;
      background: var(--accent);
      color: var(--on-accent);
      text-decoration: none;
      cursor: pointer;
    }
    article {
      background: var(--surface);
      padding: 20px;
      border-radius: 18px;
      margin: 20px 0;
    }
    label {
      display: block;
      margin: 20px 0;
      color: var(--text-2);
    }
    select {
      font: inherit;
      margin-left: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
    }
    button:focus-visible,
    a:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 3px;
    }
    p {
      color: var(--text-2);
    }
    article p {
      white-space: pre-wrap;
    }
    #status {
      color: var(--text-2);
    }
  </style>
  <body>
    <p class="eyebrow">FIELDWORK</p>
    <h1>A little room<br />to keep going.</h1>
    <p>
      You’re offline. Sessions, practice and voice need a connection. A quick
      check-in still works here and syncs when you’re back.
    </p>
    <div id="lessons"></div>
    <form id="checkin" hidden>
      <label
        >Energy
        <select name="energy">
          <option value="1">Low</option>
          <option value="3" selected>Okay</option>
          <option value="5">Plenty</option>
        </select></label
      ><label
        >Time
        <select name="minutes">
          <option value="20">20 minutes</option>
          <option value="60">One hour</option>
        </select></label
      ><button>Save a check-in</button>
    </form>
    <p id="status" role="status"></p>
    <a href="/">Try reconnecting</a>
    <script src="/offline.js" defer></script>
  </body>
</html>
